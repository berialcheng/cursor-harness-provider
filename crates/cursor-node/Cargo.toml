[package]
name = "cursor-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
cursor-core = { path = "../cursor-core", version = "=0.3.0" }
napi = { version = "2", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
