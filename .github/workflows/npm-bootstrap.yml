# One-time namespace setup with a short-lived stage-only token; never a real release.
# The maintainer must revoke NPM_BOOTSTRAP_TOKEN and delete the Secret after use.
name: one-time npm package bootstrap
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type create-three-public-package-placeholders; tiny bootstrap candidates must never be approved
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-owner-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'create-three-public-package-placeholders' }}
    runs-on: ubuntu-22.04
    environment: npm-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - name: Install isolated pinned CLI without credentials
        run: |
          umask 077
          touch "$RUNNER_TEMP/bootstrap-installer.npmrc"
          npm install --prefix "$RUNNER_TEMP/bootstrap-cli" npm@11.21.0 --ignore-scripts --no-package-lock --no-audit --no-fund --registry https://registry.npmjs.org/ --userconfig "$RUNNER_TEMP/bootstrap-installer.npmrc" --globalconfig /dev/null --cache "$RUNNER_TEMP/npm-bootstrap-install-cache"
      - name: Verify owner and stage only metadata setup candidates
        timeout-minutes: 12
        env:
          BOOTSTRAP_NPM: ${{ inputs.confirmation }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_BOOTSTRAP_TOKEN is missing; no packages staged. See docs/PUBLISHING.md." >&2
            exit 1
          fi
          node scripts/bootstrap-npm.mjs \
            "$RUNNER_TEMP/bootstrap-cli/node_modules/npm/bin/npm-cli.js" \
            "$RUNNER_TEMP/npm-bootstrap-work"
      - name: Remove only bootstrap files and report required credential cleanup
        if: ${{ always() }}
        run: |
          rm -rf -- "$RUNNER_TEMP/npm-bootstrap-work" "$RUNNER_TEMP/npm-bootstrap-install-cache" "$RUNNER_TEMP/bootstrap-installer.npmrc"
          printf '%s\n' \
            '## One-time bootstrap cleanup' \
            'Revoke the npm bootstrap token and delete the npm-release environment Secret NPM_BOOTSTRAP_TOKEN after this attempt, including failures.' \
            'Deleting runner files or a GitHub Secret does not revoke the npm token. No server-side revocation was attempted by this job.' \
            'Never approve bootstrap candidates. Keep them pending until the real version is publicly published and verified; do not reject the only candidate.' \
            'If an upload outcome is uncertain, inspect npm before any retry.' >> "$GITHUB_STEP_SUMMARY"
