# Read-only public-registry and isolated-host verification, including historical releases.
# The verifier comes from THIS workflow revision, never the historical source tree.
name: verify published npm packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify
        type: string
        required: true
        default: "0.3.0"
      source_commit:
        description: Exact source commit from the protected release and provenance
        type: string
        required: true
        default: "fb6089e011b40f89c65bf66a4afcb43791040919"
      expected_sha256:
        description: JSON native/pi/opencode hashes from the protected release audit
        type: string
        required: true
        default: '{"native":"afb1854b50e4e17fdfd9bc9080b69d314ef64d6aed961b65efee0ce0141974d7","pi":"d5b9a248d1a4aca213ae0f1817c7995622350c8228eef29d5819d487b379fe1d","opencode":"8d85c78401fb34c614c1c6eea275ebfa08db40ca6b0add8df97994677f6b031b"}'
      producers:
        description: Optional JSON native/pi/opencode immutable producer runId/runAttempt map
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  registry-and-hosts:
    if: ${{ github.repository == 'berialcheng/cursor-harness-provider' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      EXPECTED_PRODUCERS: ${{ inputs.producers }}
      # The verifier module always comes from the dispatch-time main HEAD,
      # never the historical source tree; it may be newer than this workflow file.
      VERIFIER_COMMIT: ${{ github.sha }}
      OPENCODE_CURSOR_REQUIRE_HOST: "1"
      CURSOR_NATIVE_REQUIRE_PI: "1"
    steps:
      - name: Validate immutable source and verifier selectors before checkout
        shell: bash
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERIFIER_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load the current standalone verifier without changing source HEAD
        run: |
          test "$(git rev-parse --verify HEAD)" = "$SOURCE_COMMIT"
          git cat-file -e "$VERIFIER_COMMIT^{commit}"
          umask 077
          git show "$VERIFIER_COMMIT:scripts/verify-published.mjs" > "$RUNNER_TEMP/verify-published.mjs"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Provision credential-free pinned registry CLI
        run: |
          umask 077
          touch "$RUNNER_TEMP/verify-installer-user.npmrc" "$RUNNER_TEMP/verify-installer-global.npmrc"
          npm install --prefix "$RUNNER_TEMP/verify-cli" npm@11.21.0 --ignore-scripts --no-package-lock --no-audit --no-fund --registry https://registry.npmjs.org/ --userconfig "$RUNNER_TEMP/verify-installer-user.npmrc" --globalconfig "$RUNNER_TEMP/verify-installer-global.npmrc" --cache "$RUNNER_TEMP/verify-installer-cache"
      - name: Verify public metadata, bytes, signatures and attestations
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const env = process.env;
          assert.equal(execFileSync('git', ['rev-parse', '--verify', 'HEAD'], { encoding: 'utf8' }).trim(), env.SOURCE_COMMIT);
          const { verifyPublished } = await import(pathToFileURL(join(env.RUNNER_TEMP, 'verify-published.mjs')).href);
          const options = {
            projectRoot: process.cwd(), version: env.RELEASE_VERSION, source: env.SOURCE_COMMIT,
            expectedSha256: env.EXPECTED_SHA256,
            npmCli: join(env.RUNNER_TEMP, 'verify-cli/node_modules/npm/bin/npm-cli.js'),
            outputDirectory: join(env.RUNNER_TEMP, 'published-verification'),
          };
          if (env.EXPECTED_PRODUCERS) options.producers = env.EXPECTED_PRODUCERS;
          // The sole historical branch provenance exception; new versions require vVERSION.
          if (env.RELEASE_VERSION === '0.3.0' && env.SOURCE_COMMIT === 'fb6089e011b40f89c65bf66a4afcb43791040919') {
            options.expectedSourceRef = 'refs/heads/main';
          }
          const report = await verifyPublished(options);
          console.log(JSON.stringify(report, null, 2));
          appendFileSync(env.GITHUB_STEP_SUMMARY, '## Public registry verification\n\nRead-only; source `' + report.source + '`.\n\n```json\n' + JSON.stringify(report, null, 2) + '\n```\n');
          NODE
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Build only JS/types for test infrastructure
        run: npm run build:js && npm run build:types
      - name: Install pinned mock-test host
        run: |
          npm install --global --legacy-peer-deps @opencode/cli@2.2.5
          opencode --version
      - name: Test exactly the public registry tarballs in isolated hosts (seven actual host cases)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const expected = JSON.parse(process.env.EXPECTED_SHA256);
          for (const kind of ['native', 'pi', 'opencode']) {
            const bytes = readFileSync(join(process.env.RUNNER_TEMP, 'published-verification/archives', kind + '.tgz'));
            assert.equal(createHash('sha256').update(bytes).digest('hex'), expected[kind]);
          }
          NODE
          npm run test:packages -- --archives "$RUNNER_TEMP/published-verification/archives"
